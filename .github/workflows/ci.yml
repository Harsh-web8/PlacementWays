name: PlacementWays validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: placementways
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: placementways/package-lock.json
      - run: npm ci
      - name: Dependency audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:sql
      - run: npm run test:discovery
      - run: npm run test:quality
      - run: npm run test:staging-smoke
      - run: npm run test:monitor
      - run: npm run test:staging-config
      - run: npm run test:staging-acceptance
      - run: npm run test:db
        env:
          PGHOST: localhost
          PGUSER: postgres
      - run: node tests/db/access-concurrency.mjs
      - run: node tests/db/scoped-concurrency.mjs
      - run: node tests/db/staging-fixtures.mjs
      - run: npx --no-install playwright-core install --with-deps chromium
      - run: npm run test:e2e -- --browser
  docker:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate staging deployment wiring
        working-directory: placementways
        env:
          STAGING_HOST: staging.example.com
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder_key
        run: |
          touch .env.staging.web .env.staging.worker
          docker compose -f compose.staging.yaml config --quiet
          docker run --rm --env STAGING_HOST --volume "$PWD/Caddyfile.staging:/etc/caddy/Caddyfile:ro" --entrypoint caddy caddy:2-alpine validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build image (placeholder public config)
        run: >-
          docker build placementways
          --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_ci_placeholder_key
          --build-arg NEXT_PUBLIC_SITE_URL=https://example.com
          -t placementways:ci
